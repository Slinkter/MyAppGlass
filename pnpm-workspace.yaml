packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  protobufjs: true
  sharp: true
  '@parcel/watcher': false
  unrs-resolver: false
overrides:
  '@grpc/grpc-js@<1.13.6': ^1.14.7
  protobufjs@<7.6.1: ^7.6.1
  websocket-driver@<0.7.5: ^0.7.5
  source-map-js@<1.2.2: ^1.2.2
