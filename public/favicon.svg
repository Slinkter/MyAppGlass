<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular blanco de contención para favicon (Círculo exterior) -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />
  
  <!-- Grupo del Isotipo Oficial GYA, ajustado ópticamente al centro perfecto de la masa visual -->
  <g transform="translate(250, 268) scale(0.82) translate(-250, -250)">
    <!-- Triángulo equilátero perfecto (Base 400px, Altura 346px, Centro de masa en Y=250) -->
    <path d="M 50 423 L 250 77 L 450 423 Z" fill="#FF5A5F" />
    
    <!-- Círculo blanco interior exactamente centrado en el área inferior del triángulo -->
    <circle cx="250" cy="305" r="105" stroke="white" stroke-width="8" />
    
    <!-- Ventana de 4 rombos de cristal rotada a 45 grados centrada en (250, 305) -->
    <g transform="translate(250, 305) rotate(45)">
      <rect x="-62" y="-62" width="58" height="58" fill="white" rx="2" />
      <rect x="4" y="-62" width="58" height="58" fill="white" rx="2" />
      <rect x="-62" y="4" width="58" height="58" fill="white" rx="2" />
      <rect x="4" y="4" width="58" height="58" fill="white" rx="2" />
    </g>
  </g>
</svg>
