<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Fondo circular blanco con padding para que se vea perfecto en pestañas -->
  <circle cx="250" cy="250" r="235" fill="#ffffff" />
  
  <!-- Grupo centrado en (250, 250) -->
  <g transform="translate(250, 250)">
    <!-- Triángulo estilizado centrado verticalmente -->
    <path d="M 0 -170 L 190 160 L -190 160 Z" fill="#FF5A5F"/>
    
    <!-- Círculo interior blanco de contraste -->
    <circle cx="0" cy="40" r="95" stroke="#ffffff" stroke-width="8" fill="none"/>
    
    <!-- Cuadrícula central representando el vidrio / ventana -->
    <g transform="translate(0, 40) rotate(45)">
      <rect x="-56" y="-56" width="52" height="52" fill="#ffffff" rx="3"/>
      <rect x="4" y="-56" width="52" height="52" fill="#ffffff" rx="3"/>
      <rect x="-56" y="4" width="52" height="52" fill="#ffffff" rx="3"/>
      <rect x="4" y="4" width="52" height="52" fill="#ffffff" rx="3"/>
    </g>
  </g>
</svg>
