<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular blanco de contención para favicon (Círculo exterior) -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />
  
  <!-- Grupo del Isotipo Oficial GYA, escalado al 80% y centrado exactamente (cx=250, cy=250) -->
  <g transform="translate(250, 250) scale(0.80) translate(-250, -250)">
    <!-- Triángulo rojo contenido cómodamente dentro del círculo blanco exterior -->
    <path d="M 40 450 L 250 50 L 460 450 Z" fill="#FF5A5F" />
    
    <!-- Círculo blanco interior concéntrico -->
    <circle cx="250" cy="315" r="110" stroke="white" stroke-width="8" />
    
    <!-- Ventana de 4 rombos de cristal en el centro del círculo interior -->
    <g transform="translate(250, 315) rotate(45)">
      <rect x="-66" y="-66" width="62" height="62" fill="white" rx="2" />
      <rect x="4" y="-66" width="62" height="62" fill="white" rx="2" />
      <rect x="-66" y="4" width="62" height="62" fill="white" rx="2" />
      <rect x="4" y="4" width="62" height="62" fill="white" rx="2" />
    </g>
  </g>
</svg>
