<!DOCTYPE html>
<!--
  TALLER 2 · FINAL · reserva.html refactorizada  [T2-8]
  Misma pantalla del Taller 1, ahora SIN un solo #hex:
    - los estilos viven en styles/tokens.css y styles/components.css
    - el HTML usa las clases del design system (btn, field, slot-group, card)
  Compara con taller-1-auditoria/final/reserva.html: el <style> pasó de ~45 líneas a 8.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva tu cita · TurnoYa</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<style>
  /* solo layout de esta página; todo valor sale de un token */
  header { background: var(--color-surface); border-bottom: 1px solid var(--color-divider); padding: var(--space-3) var(--space-4);
           display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }
  header nav a { display: inline-block; padding: var(--space-3) var(--space-1); }
  main { max-width: 560px; margin: var(--space-6) auto; padding: 0 var(--space-4); }
  h1 { font-size: var(--font-size-2xl); margin: 0 0 var(--space-1); }
  .sub, .terms { color: var(--color-text-muted); }
  .terms { font-size: var(--font-size-sm); }
  .actions { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-2); }
  .success { text-align: center; }
  .code { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); letter-spacing: .1em; }
</style>
</head>
<body>
<header>
  <strong>TurnoYa</strong>
  <nav aria-label="Principal"><a href="#">Servicios</a> <a href="#">Mis citas</a> <a href="#">Ayuda</a></nav>
</header>

<main>
  <section class="card" id="form-card" aria-labelledby="titulo">
    <h1 id="titulo">Reserva tu cita</h1>
    <p class="sub">Barbería Don Raúl · Miraflores</p>

    <form id="form" novalidate>
      <div class="field">
        <label class="field__label" for="servicio">Servicio</label>
        <select class="field__control" id="servicio">
          <option>Corte clásico · 30 min · S/ 35</option>
          <option>Perfilado de barba · 20 min · S/ 25</option>
          <option>Corte + barba · 45 min · S/ 55</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="fecha">Fecha</label>
        <input class="field__control" type="date" id="fecha">
      </div>

      <fieldset class="slot-group" aria-describedby="err-hora">
        <legend>Horario <span class="field__hint">(los tachados ya están ocupados)</span></legend>
        <div class="slot-group__grid" id="slots"></div>
        <p class="field__error" id="err-hora" aria-live="polite"></p>
      </fieldset>

      <div class="field">
        <label class="field__label" for="nombre">Tu nombre</label>
        <input class="field__control" id="nombre" autocomplete="name" placeholder="Ej. Camila Torres" aria-describedby="err-nombre">
        <p class="field__error" id="err-nombre" aria-live="polite"></p>
      </div>

      <div class="field">
        <label class="field__label" for="cel">Celular <span class="field__hint">(te enviaremos la confirmación)</span></label>
        <input class="field__control" id="cel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="987 654 321" aria-describedby="err-cel">
        <p class="field__error" id="err-cel" aria-live="polite"></p>
      </div>

      <p class="terms">Puedes cancelar gratis hasta 2 horas antes. No se realiza ningún cobro en línea.</p>

      <div class="actions">
        <button type="submit" class="btn btn--block" id="btn-submit">Confirmar reserva</button>
        <button type="button" class="btn btn--link" id="btn-volver">Volver a servicios</button>
      </div>
    </form>
  </section>

  <section class="card success" id="success" hidden tabindex="-1" aria-labelledby="ok-titulo">
    <h1 id="ok-titulo">¡Cita reservada!</h1>
    <p id="resumen"></p>
    <p>Tu código de reserva es</p>
    <p class="code" id="codigo"></p>
  </section>
</main>

<script>
  // La lógica es la misma del Taller 1. Solo cambian las clases que se usan en el HTML generado.
  const horarios = [
    { hora: '9:00 a. m.',  libre: true  }, { hora: '9:30 a. m.',  libre: false },
    { hora: '10:00 a. m.', libre: true  }, { hora: '10:30 a. m.', libre: true  },
    { hora: '11:00 a. m.', libre: false }, { hora: '11:30 a. m.', libre: true  },
    { hora: '3:00 p. m.',  libre: true  }, { hora: '3:30 p. m.',  libre: true  },
  ];
  const slots = document.getElementById('slots');
  horarios.forEach((h, i) => slots.insertAdjacentHTML('beforeend', `
    <div class="slot">
      <input type="radio" name="hora" id="h${i}" value="${h.hora}" ${h.libre ? '' : 'disabled'}>
      <label for="h${i}">${h.hora}${h.libre ? '' : '<span class="visually-hidden"> (ocupado)</span>'}</label>
    </div>`));
  document.getElementById('fecha').valueAsDate = new Date();

  function marcar(campo, idError, mensaje) {
    document.getElementById(idError).textContent = mensaje;
    if (campo) campo.setAttribute('aria-invalid', mensaje ? 'true' : 'false');
    return !mensaje;
  }

  const form = document.getElementById('form');
  const btn = document.getElementById('btn-submit');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const nombre = document.getElementById('nombre');
    const cel = document.getElementById('cel');
    const hora = form.querySelector('input[name="hora"]:checked');
    const okHora   = marcar(null,   'err-hora',   hora ? '' : 'Elige un horario disponible.');
    const okNombre = marcar(nombre, 'err-nombre', nombre.value.trim() ? '' : 'Escribe tu nombre para reservar.');
    const okCel    = marcar(cel,    'err-cel',    /^9\d{8}$/.test(cel.value.replace(/\s/g, '')) ? '' : 'Ingresa un celular de 9 dígitos que empiece con 9.');
    if (!okHora)   { slots.querySelector('input:not(:disabled)').focus(); return; }
    if (!okNombre) { nombre.focus(); return; }
    if (!okCel)    { cel.focus(); return; }

    // estado de carga con la clase del design system (ya no hace falta armar el spinner a mano)
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = 'Reservando…';

    setTimeout(() => {
      const servicio = document.getElementById('servicio');
      document.getElementById('resumen').textContent =
        `${servicio.value.split(' · ')[0]} · ${document.getElementById('fecha').value} · ${hora.value}`;
      document.getElementById('codigo').textContent = 'TY-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      document.getElementById('form-card').hidden = true;
      const ok = document.getElementById('success');
      ok.hidden = false; ok.focus();
    }, 1200);
  });

  document.getElementById('btn-volver').addEventListener('click', () => {
    if (confirm('¿Salir sin reservar? Se perderán los datos ingresados.')) location.href = '#';
  });
</script>
</body>
</html>
