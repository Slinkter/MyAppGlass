<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular blanco para legibilidad en pestañas del navegador -->
  <circle cx="250" cy="250" r="235" fill="#ffffff" />
  
  <!-- Triángulo principal oficial GYA -->
  <path d="M 50 430 L 250 80 L 450 430 Z" fill="#FF5A5F" />
  
  <!-- Círculo blanco central de contraste -->
  <circle cx="250" cy="310" r="100" stroke="white" stroke-width="8" />
  
  <!-- Rombos centrales (Cuadrados rotados) representando ventanas de vidrio -->
  <g transform="translate(250, 310) rotate(45)">
    <rect x="-60" y="-60" width="56" height="56" fill="white" rx="2" />
    <rect x="4" y="-60" width="56" height="56" fill="white" rx="2" />
    <rect x="-60" y="4" width="56" height="56" fill="white" rx="2" />
    <rect x="4" y="4" width="56" height="56" fill="white" rx="2" />
  </g>
</svg>
