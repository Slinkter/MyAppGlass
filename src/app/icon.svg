<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular blanco con padding para excelente contraste en pestañas -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />
  
  <!-- Grupo centrado y escalado armónicamente al 84% -->
  <g transform="translate(40, 20) scale(0.84)">
    <!-- Triángulo principal alineado a la proporción del logo original -->
    <path d="M 20 460 L 250 40 L 480 460 Z" fill="#FF5A5F" />
    
    <!-- Círculo blanco central con trazo proporcional -->
    <circle cx="250" cy="315" r="115" stroke="white" stroke-width="8" />
    
    <!-- Cuadrícula de vidrio rotada a 45 grados (Rombos) -->
    <g transform="translate(250, 315) rotate(45)">
      <rect x="-71" y="-71" width="68" height="68" fill="white" />
      <rect x="3" y="-71" width="68" height="68" fill="white" />
      <rect x="-71" y="3" width="68" height="68" fill="white" />
      <rect x="3" y="3" width="68" height="68" fill="white" />
    </g>
  </g>
</svg>
