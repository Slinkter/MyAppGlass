name: Deploy Production

# NOTA SOBRE SECRETOS REQUERIDOS:
# Para habilitar y ejecutar este workflow con éxito, se deben configurar los siguientes secretos en el repositorio (Settings > Secrets and variables > Actions):
# - FIREBASE_SERVICE_ACCOUNT_GYA_APP_4C8A9: Clave de cuenta de servicio de Firebase (JSON) con permisos de despliegue en Firebase Hosting.
# - NEXT_PUBLIC_*: Variables públicas requeridas para la compilación de Next.js (@gya/web en apps/web/.env.example):
#     - NEXT_PUBLIC_FIREBASE_API_KEY
#     - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#     - NEXT_PUBLIC_FIREBASE_PROJECT_ID
#     - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#     - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#     - NEXT_PUBLIC_FIREBASE_APP_ID
#     - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID (opcional)
#     - NEXT_PUBLIC_CONTACT_API_URL
#     - NEXT_PUBLIC_STATUS_API_URL
#     - NEXT_PUBLIC_API_URL
#     - NEXT_PUBLIC_RECAPTCHA_SITE_KEY
#
# Se mantiene con disparador manual (workflow_dispatch) mientras se terminan de aprovisionar dichos secretos.

on:
  workflow_dispatch:

# Un solo despliegue a la vez; no se cancela uno en curso para no dejar la release a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting Live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.[jt]s', 'apps/web/src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Application
        run: pnpm run build

      - name: Deploy to Firebase Hosting Live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GYA_APP_4C8A9 }}'
          channelId: live
          projectId: gya-app-4c8a9
