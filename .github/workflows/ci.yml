name: CI Pipeline

on:
  push:
    branches: [main, develop, 'firebase-hosting-*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.gemini/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.gemini/**'

# Cancela ejecuciones anteriores de la misma rama/PR para ahorrar minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Automated Tests
        run: pnpm run test:run

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.[jt]s', 'apps/web/src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run Production Build
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || 'ci_placeholder_key' }}
        run: pnpm run build

      # Debe ir después del build: next genera next-env.d.ts (tipos de *.svg), que está ignorado por git.
      - name: Run TypeScript Typecheck
        run: pnpm run typecheck
