<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo circular blanco de contención para favicon -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Grupo del isotipo exacto provisto por el usuario, escalado levemente (86%) para contención perfecta dentro del círculo -->
  <g transform="translate(250, 250) scale(0.86) translate(-250, -250)">
    <!-- Triángulo principal con el rojo exacto (#FF5053) -->
    <polygon points="250,40 460,404 40,404" fill="#FF5053" />

    <!-- Anillo circular blanco exterior -->
    <circle cx="250" cy="285" r="108" fill="none" stroke="#FFFFFF" stroke-width="11" />

    <!-- Grupo central: Cuadrado formado por 4 rombos (rotado 45 deg) -->
    <g transform="translate(250, 285) rotate(45)">
      <!-- Rombo Superior Izquierdo -->
      <rect x="-66" y="-66" width="63" height="63" fill="#FFFFFF" rx="2" />
      <!-- Rombo Superior Derecho -->
      <rect x="3" y="-66" width="63" height="63" fill="#FFFFFF" rx="2" />
      <!-- Rombo Inferior Izquierdo -->
      <rect x="-66" y="3" width="63" height="63" fill="#FFFFFF" rx="2" />
      <!-- Rombo Inferior Derecho -->
      <rect x="3" y="3" width="63" height="63" fill="#FFFFFF" rx="2" />
    </g>
  </g>
</svg>
